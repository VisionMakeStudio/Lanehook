<style>
:root{--navy:#0B132B;--navy2:#111C3B;--navy3:#18264C;--line:#22305A;--blue:#2563EB;--orange:#F59E0B;--off:#F8FAFC;--gray:#94A3B8;--muted:#5B6B86;--bd:#E2E8F0;--ok:#16A34A;--bad:#DC2626;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}

input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid #CBD5E1;font-size:16px;outline:none}

label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}label.f>*:last-child{margin-top:6px}

.side .me{margin-top:auto;font-size:13px;line-height:1.5;background:var(--navy2);border-radius:12px;padding:12px;word-break:break-all}

 .col .lc{margin-bottom:10px}}

<div id="app"><div class="auth"><div class="auth-card"><p>Loading…</p></div></div></div>
<script src="../app/config.js"></script>
<script src="../app/vendor/supabase.js"></script>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const sd=s=>{const d=new Date(s+'T12:00:00');return MON[d.getMonth()]+' '+d.getDate()};

const dlvDate=l=>iso(new Date(l.updated_at||l.created_at||Date.now()));
const money0=n=>(n<0?'-':'')+'$'+Math.round(Math.abs(n)||0).toLocaleString('en-US');
const money2=n=>(n<0?'-':'')+'$'+Math.abs(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const csvq=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
function saveCSV(name,rows){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(csvq).join(',')).join('\n')],{type:'text/csv'}));a.download=name;a.click();toast('CSV downloaded')}
function rng(p,off,now){
  now=now?new Date(now):new Date();now.setHours(12,0,0,0);let a,b,label;
  if(p==='week'){const m=new Date(now);m.setDate(m.getDate()-((m.getDay()+6)%7)+7*off);a=new Date(m);b=new Date(m);b.setDate(b.getDate()+6);label=sd(iso(a))+' – '+sd(iso(b))+', '+b.getFullYear()}
  else if(p==='year'){const y=now.getFullYear()+off;a=new Date(y,0,1,12);b=new Date(y,11,31,12);label=String(y)}
  else{a=new Date(now.getFullYear(),now.getMonth()+off,1,12);b=new Date(a.getFullYear(),a.getMonth()+1,0,12);label=a.toLocaleDateString('en-US',{month:'long',year:'numeric'})}
  return {p,off,from:iso(a),to:iso(b),label};
}
const bkey=l=>String((l.data||{}).broker||'').trim().toLowerCase();
function fleetData(r){
  const L=O.loads||[],inR=d=>d>=r.from&&d<=r.to,done=L.filter(l=>l.status==='delivered'&&inR(dlvDate(l)));
  const by={},br={};
  done.forEach(l=>{const k=l.driver_id||'-',x=by[k]=by[k]||{id:l.driver_id,n:0,rev:0,mi:0};x.n++;x.rev+=rateOf(l);x.mi+=milesOf(l);
    const b=bkey(l)||'(no broker)',y=br[b]=br[b]||{name:(l.data||{}).broker||'(no broker)',key:b,n:0,rev:0,mi:0};y.n++;y.rev+=rateOf(l);y.mi+=milesOf(l)});
  const rev=done.reduce((s,l)=>s+rateOf(l),0),mi=done.reduce((s,l)=>s+milesOf(l),0),months=[];
  if(r.p==='year')for(let m=0;m<12;m++){const k=r.from.slice(0,4)+'-'+String(m+1).padStart(2,'0'),ls=done.filter(l=>dlvDate(l).startsWith(k));months.push({label:MON[m],n:ls.length,rev:ls.reduce((s,l)=>s+rateOf(l),0)})}

  <div class="panel" style="padding:0;overflow:auto">${d.rows.length?`<table class="tbl" id="score"><thead><tr><th>#</th><th>Driver</th><th class="a">Loads</th><th class="a">Revenue</th><th class="a">Per mile</th><th class="a">Avg rate</th><th class="a">On time</th><th>Now</th></tr></thead><tbody>${d.rows.map((r,i)=>`<tr style="cursor:pointer" data-x="drvhist" data-v="${esc(r.m.user_id)}"><td>${i+1}</td><td><b>${esc(dname(r.m))}</b></td><td class="a">${r.n}</td><td class="a">${money0(r.rev)}</td><td class="a">${r.rpm?money2(r.rpm):'–'}</td><td class="a">${r.n?money0(r.avg):'–'}</td><td class="a">${pct(r.otOk,r.otN)}</td><td>${st(r.idle)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Add drivers to see scorecards.</div>'}</div>
  <p class="ft2">Based on loads marked delivered. On time means delivered within an hour of the delivery time on the load, and only counts loads that have a delivery time. It depends on drivers tapping Delivered when they deliver.</p>`;
}
function fleetLanes(){
  const d=laneData(FP),tag=y=>!d.avg||y.n<2||!y.rpm?'':y.rpm<d.avg*.85?' <span class="pill off">Below average</span>':y.rpm>=d.avg*1.15?' <span class="pill ok">Strong</span>':'';
  const tbl=(rows,title,id)=>`<div class="panel" style="padding:0;overflow:auto;margin-bottom:14px"><div style="padding:16px 18px 6px"><h3 style="margin:0">${title}</h3></div>${rows.length?`<table class="tbl" id="${id}"><thead><tr><th>${id==='lanes'?'Lane':'Broker'}</th><th class="a">Loads</th><th class="a">Avg rate</th><th class="a">Per mile</th></tr></thead><tbody>${rows.slice(0,15).map(y=>`<tr><td>${esc(y.name)}${tag(y)}</td><td class="a">${y.n}</td><td class="a">${money0(y.avg)}</td><td class="a">${y.rpm?money2(y.rpm):'–'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No delivered loads in this period.</div>'}</div>`;
  return perToggle()+`<div class="kpis"><div class="kpi"><span>Your average per mile</span><b>${d.avg?money2(d.avg):'–'}</b></div><div class="kpi"><span>Loads in this period</span><b>${d.n}</b></div></div><div class="row2" style="margin:0 0 14px"><button class="btn sm" data-x="fcsv" data-v="lanes">Download CSV</button></div>${tbl(d.lanes,'Lanes','lanes')}${tbl(d.brokers,'Brokers','brokers')}<p class="ft2">Per mile uses loads that have miles filled in. Below average means more than 15% under your own average, with at least 2 loads.</p>`;
}
function fleetPayRun(){
  const d=payRun(),r=d.r;
  const nav=`<div class="chips">${[['week','Week'],['month','Month']].map(c=>`<button class="chip ${FPAY===c[0]?'on':''}" data-x="ppay" data-v="${c[0]}">${c[1]}</button>`).join('')}</div><div class="row2" style="justify-content:center;margin:0 0 14px"><button class="btn sm" data-x="pnav" data-v="-1" aria-label="Earlier">‹</button><b style="min-width:190px;text-align:center">${esc(r.label)}</b><button class="btn sm" data-x="pnav" data-v="1" aria-label="Later">›</button>${FPOFF?'<button class="btn sm" data-x="pnow">This '+FPAY+'</button>':''}</div>`;
  return nav+`<div class="kpis"><div class="kpi"><span>Total to pay</span><b id="pgt">${money2(d.total)}</b></div><div class="kpi"><span>Drivers with loads</span><b>${d.rows.filter(x=>x.n).length}</b></div></div>
  ${d.missing?`<div class="banner info"><b>Set a pay rate</b>${d.missing==1?'1 driver with loads has no rate yet. Rates are saved for next time.':d.missing+' drivers with loads have no rate yet. Rates are saved for next time.'}</div>`:''}
  <div class="row2" style="margin:0 0 14px"><button class="btn pri sm" data-x="fprint">Print pay run</button><button class="btn sm" data-x="fcsv" data-v="pay">Download CSV</button></div>
  <div class="panel" style="padding:0;overflow:auto"><table class="tbl" id="payrun"><thead><tr><th>Driver</th><th class="a">Loads</th><th class="a">Rate total</th><th>Pay by</th><th>Rate</th><th class="a">Pay</th></tr></thead><tbody>${d.rows.map(x=>`<tr><td><b>${esc(dname(x.m))}</b></td><td class="a">${x.n}</td><td class="a">${money0(x.rate)}</td><td><select data-prm="${esc(x.m.user_id)}" aria-label="Pay by"><option value="" ${x.p?'':'selected'}>Not set</option><option value="pct" ${x.p&&x.p.mode==='pct'?'selected':''}>Percent</option><option value="mile" ${x.p&&x.p.mode==='mile'?'selected':''}>Per mile</option></select></td><td><input data-prv="${esc(x.m.user_id)}" inputmode="decimal" style="width:84px" value="${x.p?esc(x.p.val):''}" ${x.p?'':'disabled'} placeholder="${x.p&&x.p.mode==='mile'?'0.60':'25'}" aria-label="Rate"></td><td class="a" data-pg="${esc(x.m.user_id)}">${x.p?money2(x.pay):'–'}</td></tr>`).join('')}</tbody></table></div>
  <p class="ft2">Pay is worked out from delivered loads in the dates shown. Your numbers, your rules. LaneHook does not file payroll or taxes.</p>`;
}
function paintPayRun(){const d=payRun();d.rows.forEach(x=>{const c=document.querySelector('[data-pg="'+x.m.user_id+'"]');if(c)c.textContent=x.p?money2(x.pay):'–'});const t=$('#pgt');if(t)t.textContent=money2(d.total)}
function fleetRemind(){
  const its=FD.items.slice(),grp=[['Overdue',i=>daysTo(i.due)<0],['Due in 30 days',i=>{const d=daysTo(i.due);return d>=0&&d<=30}],['Later',i=>daysTo(i.due)>30]];
  const row=i=>{const di=dueInfo(i.due);return `<div class="drv" style="cursor:pointer" data-x="fedit" data-v="${esc(i.id)}"><div class="g"><b>${esc(i.name)}</b><small><span>${i.kind==='document'?'Document':'Service'}</span> · ${itemWho(i)} · ${esc(day(i.due+'T12:00:00'))}${i.note?' · '+esc(i.note):''}</small></div><span class="pill ${di.c}">${di.t}</span></div>`};
  return `<div class="row2" style="margin:0 0 14px"><button class="btn pri sm" data-x="fadd">Add reminder</button>${its.length?'<button class="btn sm" data-x="fcsv" data-v="rem">Download CSV</button>':''}</div>`+(its.length?grp.map(g=>{const ls=its.filter(g[1]);return ls.length?`<div class="panel" style="padding:0;margin-bottom:14px"><div style="padding:16px 18px 6px"><h3 style="margin:0">${g[0]} · ${ls.length}</h3></div>${ls.map(row).join('')}</div>`:''}).join(''):`<div class="panel"><div class="empty">No reminders yet.<br>Add insurance, registration, inspections and service dates, and LaneHook warns you before they run out.</div></div>`);
}
function fleetTrucks(){
  const ts=FD.trucks;
  return `<div class="row2" style="margin:0 0 14px"><button class="btn pri sm" data-x="tadd">Add truck</button></div>`+(ts.length?`<div class="panel" style="padding:0">${ts.map(t=>{const its=FD.items.filter(i=>i.truck_id===t.id).sort((a,b)=>a.due.localeCompare(b.due)),m=t.driver_id?drv(t.driver_id):null,nx=its[0],di=nx?dueInfo(nx.due):null;
    return `<div class="drv" style="cursor:pointer" data-x="tedit" data-v="${esc(t.id)}"><div class="g"><b>${esc(t.name)}</b><small>${[t.plate,t.vin,m?dname(m):'No driver'].filter(Boolean).map(esc).join(' · ')}</small></div>${nx?`<span class="pill ${di.c}" title="${esc(nx.name)}">${di.t}</span>`:'<span class="pill">No reminders</span>'}</div>`}).join('')}</div>`:`<div class="panel"><div class="empty">No trucks yet.<br>Add your trucks, then attach reminders like oil changes and inspections to each one.</div></div>`);
}
/* ----- forms ----- */
async function fact(name,args,okMsg){const r=await rpc(name,args);if(r){FD=r;closeSheet();if(okMsg)toast(okMsg);draw()}return r}
function appliesOpts(sel){return `<option value="" ${!sel?'selected':''}>Whole company</option>`+(FD.trucks.length?`<optgroup label="Trucks">${FD.trucks.map(t=>`<option value="t:${esc(t.id)}" ${sel==='t:'+t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</optgroup>`:'')+((O.members||[]).length?`<optgroup label="Drivers">${(O.members||[]).map(m=>`<option value="d:${esc(m.user_id)}" ${sel==='d:'+m.user_id?'selected':''}>${esc(dname(m))}</option>`).join('')}</optgroup>`:'')}
function itemForm(id){
  const it=id?FD.items.find(x=>x.id===id):null,sel=it?(it.truck_id?'t:'+it.truck_id:it.driver_id?'d:'+it.driver_id:''):'';
  const s=sheet(`<h2>${it?'Edit reminder':'New reminder'}</h2><form id="fif" style="margin-top:10px"><div class="two"><label class="f"><span>Type</span><select name="k"><option value="document" ${it&&it.kind==='service'?'':'selected'}>Document</option><option value="service" ${it&&it.kind==='service'?'selected':''}>Service</option></select></label><label class="f"><span>Due date</span><input type="date" name="d" required value="${it?esc(it.due):''}"></label></div>
   <label class="f"><span>Name</span><input name="n" maxlength="80" required list="fsug" value="${it?esc(it.name):''}" placeholder="Insurance, oil change…"><datalist id="fsug">${['Insurance','Registration','DOT annual inspection','IFTA decal','Medical card','CDL','Oil change','Tires','Brakes','Preventive maintenance'].map(x=>`<option value="${x}">`).join('')}</datalist></label>
   <label class="f"><span>Applies to</span><select name="a">${appliesOpts(sel)}</select></label><label class="f"><span>Note (optional)</span><input name="o" maxlength="300" value="${it?esc(it.note):''}"></label>
   <div style="display:grid;grid-template-columns:${it?'1fr 1fr 1fr':'1fr 1fr'};gap:10px;margin-top:6px"><button type="button" class="btn" id="fc">Cancel</button>${it?'<button type="button" class="btn bad" id="fd">Delete</button>':''}<button class="btn pri">Save</button></div></form>`);
  $('#fc',s).onclick=closeSheet;
  if(it)$('#fd',s).onclick=()=>confirmBox('Delete this reminder?',it.name+'','Delete',()=>fact('delete_fleet_item',{p_id:it.id},'Deleted'));
  $('#fif',s).onsubmit=e=>{e.preventDefault();const f=e.target,a=f.a.value;fact('save_fleet_item',{p_id:it?it.id:null,p_kind:f.k.value,p_name:f.n.value,p_due:f.d.value,p_driver:a.startsWith('d:')?a.slice(2):null,p_truck:a.startsWith('t:')?a.slice(2):null,p_note:f.o.value},'Saved')};
}
function truckForm(id){
  const t=id?FD.trucks.find(x=>x.id===id):null;
  const s=sheet(`<h2>${t?'Edit truck':'New truck'}</h2><form id="tff" style="margin-top:10px"><label class="f"><span>Name or number</span><input name="n" maxlength="60" required value="${t?esc(t.name):''}" placeholder="Truck 12"></label>
   <div class="two"><label class="f"><span>Plate</span><input name="p" maxlength="20" value="${t?esc(t.plate):''}"></label><label class="f"><span>VIN</span><input name="v" maxlength="24" value="${t?esc(t.vin):''}"></label></div>
   <label class="f"><span>Driver</span><select name="d"><option value="">No driver</option>${(O.members||[]).map(m=>`<option value="${esc(m.user_id)}" ${t&&t.driver_id===m.user_id?'selected':''}>${esc(dname(m))}</option>`).join('')}</select></label><label class="f"><span>Note (optional)</span><input name="o" maxlength="300" value="${t?esc(t.note):''}"></label>
   <div style="display:grid;grid-template-columns:${t?'1fr 1fr 1fr':'1fr 1fr'};gap:10px;margin-top:6px"><button type="button" class="btn" id="fc">Cancel</button>${t?'<button type="button" class="btn bad" id="fd">Delete</button>':''}<button class="btn pri">Save</button></div></form>`);
  $('#fc',s).onclick=closeSheet;
  if(t)$('#fd',s).onclick=()=>confirmBox('Delete this truck?','Its reminders are deleted too.','Delete',()=>fact('delete_truck',{p_id:t.id},'Deleted'));
  $('#tff',s).onsubmit=e=>{e.preventDefault();const f=e.target;fact('save_truck',{p_id:t?t.id:null,p_name:f.n.value,p_plate:f.p.value,p_vin:f.v.value,p_driver:f.d.value||null,p_note:f.o.value},'Saved')};
}
function fleetCSVrows(w){
  if(w==='score'){const d=scoreData(FP),rows=[['Driver','Loads','Revenue','Miles','Revenue per mile','Average rate','On time delivered','Loads with a delivery time']];d.rows.forEach(r=>rows.push([dname(r.m),r.n,r.rev.toFixed(2),Math.round(r.mi),r.rpm?r.rpm.toFixed(2):'',r.n?r.avg.toFixed(2):'',r.otOk,r.otN]));return ['lanehook-scorecards-'+FP+'d.csv',rows]}
  if(w==='lanes'){const d=laneData(FP),rows=[['Type','Name','Loads','Average rate','Per mile']];d.lanes.forEach(y=>rows.push(['Lane',y.name,y.n,y.avg.toFixed(2),y.rpm?y.rpm.toFixed(2):'']));d.brokers.forEach(y=>rows.push(['Broker',y.name,y.n,y.avg.toFixed(2),y.rpm?y.rpm.toFixed(2):'']));return ['lanehook-lanes-'+FP+'d.csv',rows]}
  if(w==='pay'){const d=payRun(),rows=[['Driver','Loads','Rate total','Miles','Pay by','Pay']];d.rows.forEach(x=>rows.push([dname(x.m),x.n,x.rate.toFixed(2),Math.round(x.mi),payLabel(x.p),x.p?x.pay.toFixed(2):'']));rows.push([],['Total','','','','',d.total.toFixed(2)]);return ['lanehook-pay-run-'+d.r.from+'.csv',rows]}
  const rows=[['Type','Name','Applies to','Due','Days left','Note']];FD.items.forEach(i=>rows.push([i.kind,i.name,itemWhoRaw(i)||'Whole company',i.due,daysTo(i.due),i.note]));return ['lanehook-reminders.csv',rows];
}
function payRunPaper(){const d=payRun();return `<div class="paper"><h2>Pay run</h2><div><b>${esc(O.company.name)}</b> · ${esc(d.r.label)}</div><table><thead><tr><th>Driver</th><th>Loads</th><th class="a">Rate total</th><th>Pay by</th><th class="a">Pay</th></tr></thead><tbody>${d.rows.filter(x=>x.n).map(x=>`<tr><td>${esc(dname(x.m))}</td><td>${x.n}</td><td class="a">${money2(x.rate)}</td><td>${esc(payLabel(x.p)||'Not set')}</td><td class="a">${x.p?money2(x.pay):'–'}</td></tr>`).join('')}<tr><td colspan="4"><b>Total</b></td><td class="a"><b>${money2(d.total)}</b></td></tr></tbody></table><small>Prepared with LaneHook on ${day(new Date())}.</small></div>`}
Object.assign(XA,{
  ftab:(b,e)=>{if(e&&e.preventDefault)e.preventDefault();FT=b.dataset.v;draw()},fper:b=>{FP=+b.dataset.v;draw()},ppay:b=>{FPAY=b.dataset.v;FPOFF=0;draw()},pnav:b=>{FPOFF+=+b.dataset.v;draw()},pnow:()=>{FPOFF=0;draw()},
  fadd:()=>itemForm(null),fedit:b=>itemForm(b.dataset.v),tadd:()=>truckForm(null),tedit:b=>truckForm(b.dataset.v),
  fup:()=>PLAN&&PLAN.has_customer?portal():openPlans(),fretry:()=>{FD=undefined;draw()},
  fprint:()=>{const s=sheet(payRunPaper()+`<div class="noprint" style="margin-top:14px"><button class="btn pri" style="width:100%" id="pp">Print or save PDF</button></div>`);$('#pp',s).onclick=()=>window.print()},
  fcsv:b=>{const x=fleetCSVrows(b.dataset.v);saveCSV(x[0],x[1])}
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='idlesel'){try{localStorage.setItem('lh-d-idle',t.value)}catch(x){}draw();return}
  const d=t.dataset&&(t.dataset.prm||t.dataset.prv);if(!d||!FD)return;
  const row=t.closest('tr'),sel=row.querySelector('[data-prm]'),inp=row.querySelector('[data-prv]');
  if(t.dataset.prm!==undefined){
    if(!sel.value){const r=await rpc('save_fleet_pay',{p_driver:d,p_mode:null,p_val:null});if(r){FD=r;draw()}return}
    inp.disabled=false;inp.placeholder=sel.value==='mile'?'0.60':'25';if(!inp.value){inp.focus();return}
  }
  const v=Number(String(inp.value).replace(/[^0-9.]/g,''));if(!sel.value||!inp.value||isNaN(v))return;
  const r=await rpc('save_fleet_pay',{p_driver:d,p_mode:sel.value,p_val:v});if(r){FD=r;paintPayRun()}
});
function demoFleet(){
  const ms=(O&&O.members)||[],dt=n=>iso(new Date(Date.now()+n*DAYMS));
  const trucks=[{id:'dt1',name:'Truck 12',plate:'NJ-482XK',vin:'1FDXE4FS8KDC12345',driver_id:ms[0]&&ms[0].user_id,note:''},{id:'dt2',name:'Truck 14',plate:'NJ-771PL',vin:'3C7WRNBL1KG654321',driver_id:ms[1]&&ms[1].user_id,note:''},{id:'dt3',name:'Truck 21',plate:'NY-HJ4820',vin:'1HTMMAAL5KH987654',driver_id:ms[2]&&ms[2].user_id,note:''}];
  const items=[['document','Insurance',-4,null],['service','Oil change',3,'dt1'],['document','DOT annual inspection',12,'dt2'],['service','Tires',26,'dt3'],['document','Registration',41,'dt1'],['document','Medical card',58,null,ms[3]&&ms[3].user_id],['document','IFTA decal',95,null]].map((x,i)=>({id:'di'+i,kind:x[0],name:x[1],due:dt(x[2]),truck_id:x[3]||null,driver_id:x[4]||null,note:''}));
  return {fleet:true,trucks,items:items.sort((a,b)=>a.due.localeCompare(b.due)),pay:ms.slice(0,3).map((m,i)=>({driver_id:m.user_id,mode:i===2?'mile':'pct',val:i===2?0.6:25}))};
}
function demoFleetRpc(name,a){
  const F=DFD||(DFD=demoFleet());let ch=true;
  if(name==='fleet_data')return F;
  if(name==='save_fleet_item'){let x=a.p_id&&F.items.find(i=>i.id===a.p_id);if(!x){x={id:'di'+Date.now()};F.items.push(x)}Object.assign(x,{kind:a.p_kind,name:a.p_name,due:a.p_due,driver_id:a.p_driver||null,truck_id:a.p_truck||null,note:a.p_note||''});F.items.sort((p,q)=>p.due.localeCompare(q.due))}
  else if(name==='delete_fleet_item')F.items=F.items.filter(i=>i.id!==a.p_id);
  else if(name==='save_truck'){let x=a.p_id&&F.trucks.find(i=>i.id===a.p_id);if(!x){x={id:'dt'+Date.now()};F.trucks.push(x)}Object.assign(x,{name:a.p_name,plate:a.p_plate||'',vin:a.p_vin||'',driver_id:a.p_driver||null,note:a.p_note||''})}
  else if(name==='delete_truck'){F.trucks=F.trucks.filter(i=>i.id!==a.p_id);F.items=F.items.filter(i=>i.truck_id!==a.p_id)}
  else if(name==='save_fleet_pay'){F.pay=F.pay.filter(p=>p.driver_id!==a.p_driver);if(a.p_mode)F.pay.push({driver_id:a.p_driver,mode:a.p_mode,val:a.p_val})}
  else ch=false;
  return ch?F:undefined;
}
(async function(){

  EMAIL=data.session.user.email||'';tellOwner(data.session);await load();
  if(window.LHInstall)LHInstall.auto(()=>!!document.querySelector('.shell'));
})();
