<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Load status | LaneHook</title>
<meta name="theme-color" content="#0B132B">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--navy:#0B132B;--blue:#2563EB;--orange:#F59E0B;--off:#F8FAFC;--muted:#64748B;--bd:#E2E8F0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--off);color:var(--navy);line-height:1.5}
header{background:var(--navy);color:#fff;padding:16px 20px;font-weight:800;letter-spacing:.01em}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px;margin:0}
.route{display:flex;gap:12px;align-items:center;margin:16px 0;font-size:18px;font-weight:700}.route span.a{color:var(--orange)}
.steps{list-style:none;margin:16px 0 0;padding:0}.steps li{display:flex;gap:12px;align-items:center;padding:10px 0;color:var(--muted)}
.steps i{width:22px;height:22px;border-radius:50%;border:2px solid #CBD5E1;flex-shrink:0;display:block}
.steps li.done{color:var(--navy)}.steps li.done i{background:var(--blue);border-color:var(--blue)}
.steps li.now{color:var(--navy);font-weight:800}.steps li.now i{background:var(--orange);border-color:var(--orange);box-shadow:0 0 0 5px #FEF3C7}
.pill{display:inline-block;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:800;background:#DBEAFE;color:#1D4ED8}.pill.bad{background:#FEE2E2;color:#991B1B}.pill.ok{background:#DCFCE7;color:#166534}
small{color:var(--muted)}a{color:var(--blue)}
</style>
</head>
<body>
<header>LaneHook</header>
<main><div id="out"><div class="card"><p class="sub">Loading…</p></div></div>
<p style="text-align:center;font-size:13px;color:var(--muted)">This page shows the status only. It refreshes by itself.<br>Status shared with you by the carrier.</p></main>
<script src="/app/config.js"></script>
<script>
'use strict';
const C=window.LH_CONFIG,out=document.getElementById('out');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=s=>{const d=s?new Date(s):null;return d&&!isNaN(d)?d.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''};
const token=(new URLSearchParams(location.search).get('t')||'').trim();
const STEPS=[['assigned','Assigned to a driver'],['accepted','Driver accepted'],['picked_up','Picked up, on the road'],['delivered','Delivered']];
function bad(msg){out.innerHTML=`<div class="card"><h1>Link not available</h1><p class="sub">${esc(msg)}</p></div>`}
function paint(d){
  const order=['open','assigned','accepted','picked_up','delivered'],idx=order.indexOf(d.status);
  const canceled=d.status==='canceled';
  const steps=STEPS.map(([k,t])=>{const i=order.indexOf(k);const cls=canceled?'':(i<idx||d.status==='delivered')?'done':(i===idx?'now':'');return `<li class="${cls}"><i></i>${esc(t)}</li>`}).join('');
  const lab=canceled?'Canceled':d.status==='open'?'Not assigned yet':(STEPS.find(s=>s[0]===d.status)||[0,d.status])[1];
  out.innerHTML=`<div class="card"><p class="sub">${esc(d.company||'')}</p><h1>${d.ref?'Load #'+esc(d.ref):'Load status'}</h1><span class="pill ${canceled?'bad':d.status==='delivered'?'ok':''}" id="st">${esc(lab)}</span>
  <div class="route"><span>${esc(d.pickCity||'Pickup')}</span><span class="a">→</span><span>${esc(d.delivCity||'Delivery')}</span></div>
  <small>${d.pickTime?'Pickup '+esc(when(d.pickTime))+'<br>':''}${d.delivTime?'Delivery '+esc(when(d.delivTime)):''}</small>
  ${canceled?'':`<ul class="steps">${steps}</ul>`}<p class="sub" style="margin-top:12px">Updated ${esc(when(d.updated_at))}</p></div>`;
}
async function get(){
  if(!/^[0-9a-f]{64}$/.test(token))return bad('This link is not complete. Ask the sender for a new one.');
  try{const r=await fetch(C.supabaseUrl+'/rest/v1/rpc/load_share_public',{method:'POST',headers:{'content-type':'application/json',apikey:C.supabaseKey,authorization:'Bearer '+C.supabaseKey},body:JSON.stringify({p_token:token})});
    if(!r.ok)return bad('Could not load right now. Try again in a minute.');
    const d=await r.json();if(!d)return bad('This link has expired or was turned off. Ask the sender for a new one.');paint(d)}
  catch(e){if(!out.querySelector('h1'))bad('You appear to be offline.')}
}
get();setInterval(()=>{if(!document.hidden)get()},60000);
</script>
</body>
</html>
